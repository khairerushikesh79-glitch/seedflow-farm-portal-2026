<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SeedFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background: #eef1e9;
            color: #183326;
            overflow-x: hidden;
        }

        /* BACKGROUND */

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
        }

        .bg-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            z-index: -1;
        }

        .circle-one {
            width: 300px;
            height: 300px;
            background: #d8e4d6;
            top: -100px;
            left: -100px;
        }

        .circle-two {
            width: 400px;
            height: 400px;
            background: #dfe8dc;
            bottom: -180px;
            right: -130px;
        }

        /* MAIN CARD */

        .login-wrapper {
            width: 100%;
            max-width: 1050px;
            min-height: 650px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 32px;

            overflow: hidden;

            box-shadow: 0 30px 80px rgba(25,55,35,0.13);
        }

        /* LEFT IMAGE */

        .visual {
            position: relative;
            min-height: 650px;
            overflow: hidden;
        }

        .visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .visual::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(15,45,25,0.05),
                    rgba(15,45,25,0.72)
                );
        }

        .visual-content {
            position: absolute;
            z-index: 2;

            left: 42px;
            right: 42px;
            bottom: 40px;

            color: white;
        }

        .mini-logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);

            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 14px;

            font-size: 22px;
            margin-bottom: 18px;
        }

        .visual-content h2 {
            font-family: "Playfair Display", serif;
            font-size: 45px;
            line-height: 1.05;
            margin-bottom: 15px;
        }

        .visual-content p {
            color: rgba(255,255,255,0.82);
            font-size: 14px;
            line-height: 1.7;
            max-width: 390px;
        }

        /* LOGIN AREA */

        .login-area {
            padding: 60px 55px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 22px;
            font-weight: 700;

            margin-bottom: 38px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #285c3b;
            color: white;

            border-radius: 12px;
        }

        .login-heading {
            font-family: "Playfair Display", serif;
            font-size: 43px;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718078;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* ROLE */

        .role-title {
            font-size: 12px;
            font-weight: 700;
            color: #627269;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .role {
            border: 1px solid #dfe6df;
            background: #f7f8f4;

            border-radius: 13px;
            padding: 13px;

            cursor: pointer;
            text-align: center;

            transition: 0.25s;
        }

        .role:hover {
            transform: translateY(-2px);
            border-color: #9eb4a2;
        }

        .role.active {
            background: #e5eee4;
            border-color: #285c3b;
            color: #285c3b;
        }

        .role-icon {
            display: block;
            font-size: 21px;
            margin-bottom: 5px;
        }

        .role span:last-child {
            font-size: 12px;
            font-weight: 600;
        }

        /* FORM */

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #53635a;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;

            padding: 15px 45px 15px 15px;

            border: 1px solid #dfe5df;
            border-radius: 13px;

            background: #fafbf8;

            outline: none;

            color: #183326;
            font-family: inherit;
            font-size: 14px;

            transition: 0.25s;
        }

        input:focus {
            border-color: #6d9476;
            box-shadow: 0 0 0 4px rgba(77,117,87,0.08);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            cursor: pointer;
            font-size: 17px;

            opacity: 0.6;
        }

        .password-toggle:hover {
            opacity: 1;
        }

        /* OPTIONS */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 5px 0 25px;

            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #68766e;
        }

        .remember input {
            width: 14px;
            height: 14px;
            accent-color: #285c3b;
            padding: 0;
        }

        .forgot {
            color: #285c3b;
            text-decoration: none;
            font-weight: 600;
        }

        /* BUTTON */

        .login-button {
            width: 100%;
            padding: 16px;

            border: none;
            border-radius: 13px;

            background: #285c3b;
            color: white;

            font-family: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 12px 25px rgba(40,92,59,0.18);

            transition: 0.3s;
        }

        .login-button:hover {
            background: #183f28;
            transform: translateY(-2px);
        }

        /* REGISTER */

        .register {
            text-align: center;
            margin-top: 25px;

            color: #758078;
            font-size: 13px;
        }

        .register a {
            color: #285c3b;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            text-decoration: none;
            color: #77847c;
            font-size: 12px;
        }

        .back-home a:hover {
            color: #285c3b;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .page {
                padding: 15px;
            }

            .login-wrapper {
                grid-template-columns: 1fr;
                max-width: 500px;
                min-height: auto;
                border-radius: 25px;
            }

            .visual {
                min-height: 260px;
                height: 260px;
            }

            .visual-content {
                left: 25px;
                right: 25px;
                bottom: 25px;
            }

            .visual-content h2 {
                font-size: 32px;
            }

            .visual-content p {
                font-size: 12px;
            }

            .login-area {
                padding: 38px 28px 35px;
            }

            .brand {
                margin-bottom: 25px;
            }

            .login-heading {
                font-size: 36px;
            }
        }

        @media (max-width: 420px) {

            .visual {
                min-height: 220px;
                height: 220px;
            }

            .visual-content h2 {
                font-size: 28px;
            }

            .login-area {
                padding: 30px 20px;
            }

            .roles {
                gap: 7px;
            }
        }

    </style>
</head>

<body>

    <div class="bg-circle circle-one"></div>
    <div class="bg-circle circle-two"></div>


    <main class="page">

        <div class="login-wrapper">


            <!-- LEFT VISUAL -->

            <section class="visual">

                <img
                    src="https://images.unsplash.com/photo-1495107334309-fcf20504a5ab?auto=format&fit=crop&w=1200&q=85"
                    alt="Green agricultural field">

                <div class="visual-content">

                    <div class="mini-logo">🌱</div>

                    <h2>
                        Grow smarter.<br>
                        Flow better.
                    </h2>

                    <p>
                        One connected platform for seed companies,
                        farmers and quality teams.
                    </p>

                </div>

            </section>


            <!-- LOGIN -->

            <section class="login-area">

                <div class="brand">
                    <div class="brand-icon">🌱</div>
                    SeedFlow
                </div>

                <h1 class="login-heading">
                    Welcome back.
                </h1>

                <p class="subtitle">
                    Sign in to continue managing your seed journey.
                </p>


                <!-- ROLE -->

                <div class="role-title">
                    Continue as
                </div>

                <div class="roles">

                    <div class="role active" onclick="selectRole(this, 'Farmer')">
                        <span class="role-icon">👨‍🌾</span>
                        <span>Farmer</span>
                    </div>

                    <div class="role" onclick="selectRole(this, 'Company')">
                        <span class="role-icon">🏢</span>
                        <span>Company</span>
                    </div>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-box">

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email">

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password">

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            id="eye">
                            👁
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="forgot">
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    class="login-button"
                    onclick="loginUser()">

                    Login to SeedFlow →

                </button>


                <!-- REGISTER -->

                <div class="register">

                    Don't have an account?
                    <a href="#">Create account</a>

                </div>


                <!-- HOME -->

                <div class="back-home">
                    <a href="index.html">
                        ← Back to Home
                    </a>
                </div>

            </section>

        </div>

    </main>


    <script>

        let selectedRole = "Farmer";


        function selectRole(element, role) {

            document.querySelectorAll(".role")
                .forEach(item => item.classList.remove("active"));

            element.classList.add("active");

            selectedRole = role;
        }


        function togglePassword() {

            const password =
                document.getElementById("password");

            const eye =
                document.getElementById("eye");

            if (password.type === "password") {

                password.type = "text";
                eye.textContent = "🙈";

            } else {

                password.type = "password";
                eye.textContent = "👁";
            }
        }


        function loginUser() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value.trim();


            if (!email || !password) {

                alert("Please enter your email and password.");
                return;
            }


            alert(
                "Login system will be connected to the database soon.\n\nSelected role: "
                + selectedRole
            );
        }

    </script>

</body>
  </html>
